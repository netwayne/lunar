5A\u59FB\u53CA\u6C9F\u901A\u3002"],36:["\u547D\u4E2D\u81EA\u5E26\u4E00\u5B9A\u798F\u6C14\uFF0C\u4E0D\u5FC5\u4E8B\u4E8B\u64CD\u52B3\uFF0C\u8BF8\u4E8B\u8F83\u6613\u987A\u5229\u800C\u6210\u3002","\u5E38\u4E3A\u5BB6\u4E8B\u64CD\u5FC3\u5FE7\u8651\uFF0C\u5B9C\u7559\u610F\u8A00\u8BED\u5206\u5BF8\u3001\u907F\u514D\u53E3\u89D2\u4E89\u6267\u3002"],37:["\u5144\u5F1F\u52A9\u529B\u8F83\u5C11\uFF0C\u51E1\u4E8B\u9700\u72EC\u529B\u652F\u6491\uFF0C\u7956\u4E1A\u4EA6\u96BE\u957F\u4E45\u7559\u5B88\u3002","\u884C\u4E8B\u8F83\u4E3A\u8D39\u529B\u3001\u6CE2\u6298\u7A0D\u591A\uFF0C\u51E1\u4E8B\u5B9C\u591A\u52A0\u8C0B\u5212\u3001\u4E09\u601D\u800C\u884C\u3002"],38:["\u6027\u60C5\u6E05\u9AD8\u4E0D\u4FD7\uFF0C\u4F20\u7EDF\u4E0A\u5B9C\u8D70\u4ED5\u9014\u6216\u4E13\u4E1A\u8DEF\u7EBF\uFF0C\u4E2D\u5E74\u540E\u6E10\u663E\u58F0\u540D\u3002","\u4F20\u7EDF\u4E0A\u89C6\u4E3A\u5409\u5E86\u4E4B\u547D\uFF0C\u58F0\u540D\u53EF\u626C\uFF0C\u665A\u5E74\u8863\u7984\u8F83\u4E3A\u4E30\u76C8\u3002"],39:["\u8FD0\u52BF\u8D77\u4F0F\u8F83\u5927\uFF0C\u4E8B\u500D\u529F\u534A\uFF0C\u82E6\u5FC3\u7ECF\u8425\u7EC8\u6709\u6240\u6210\u4F46\u5386\u7A0B\u8270\u8F9B\u3002","\u65E9\u5E74\u5954\u6CE2\u52B3\u788C\u6536\u83B7\u6709\u9650\uFF0C\u4E2D\u5E74\u8FD0\u52BF\u504F\u5F31\uFF0C\u5B9C\u8010\u5FC3\u7B49\u5F85\u8F6C\u673A\u3002"],40:["\u8863\u98DF\u7EF5\u957F\u3001\u9887\u6709\u4E3B\u89C1\uFF0C\u65E9\u5E74\u5386\u7ECF\u98CE\u971C\u78E8\u70BC\uFF0C\u540E\u534A\u751F\u6E10\u4EAB\u5B89\u5EB7\u3002","\u773C\u524D\u8FD0\u52BF\u7565\u663E\u6B20\u4F73\u3001\u5386\u7ECF\u8F9B\u82E6\uFF0C\u4F20\u7EDF\u4E0A\u8BA4\u4E3A\u665A\u5E74\u5C06\u6E10\u5165\u4F73\u5883\u3002"],41:["\u4E3A\u4EBA\u80FD\u5E72\u51FA\u4F17\uFF0C\u4E2D\u5E74\u540E\u6E10\u5F97\u60A0\u7136\u6E05\u798F\uFF0C\u80DC\u4E8E\u65E9\u5E74\u8FD0\u52BF\u3002","\u4E3A\u4EBA\u4E0D\u51E1\u4F46\u4E5F\u5386\u7ECF\u8270\u8F9B\uFF0C\u4E2D\u5E74\u6E10\u5F97\u81EA\u5728\uFF0C\u665A\u5E74\u66F4\u80DC\u4ECE\u524D\u3002"],42:["\u9047\u4E8B\u5B9C\u653E\u5BBD\u5FC3\uFF0C\u4E2D\u5E74\u8FD0\u52
